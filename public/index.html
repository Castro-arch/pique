<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <title>Pique</title>
    <!-- Reset recomendado pelo react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #101418;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Fontes do site: WOFF2 só com o alfabeto latino (com os acentos do
         português), servidas pelo próprio site. Os nomes são os mesmos que o
         app usa no fontFamily. font-display: swap mostra o texto na hora com a
         fonte do sistema e troca quando a do Pique chega. Licença OFL em /fonts. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Inter_400Regular'; font-weight: 400; font-display: swap; src: url(/fonts/inter-latin.woff2) format('woff2'); }
      @font-face { font-family: 'Inter_500Medium'; font-weight: 500; font-display: swap; src: url(/fonts/inter-latin.woff2) format('woff2'); }
      @font-face { font-family: 'Inter_600SemiBold'; font-weight: 600; font-display: swap; src: url(/fonts/inter-latin.woff2) format('woff2'); }
      @font-face { font-family: 'BricolageGrotesque_700Bold'; font-weight: 700; font-display: swap; src: url(/fonts/bricolage-latin.woff2) format('woff2'); }
      @font-face { font-family: 'BricolageGrotesque_800ExtraBold'; font-weight: 800; font-display: swap; src: url(/fonts/bricolage-latin.woff2) format('woff2'); }
    </style>
    <!-- Tela de carregamento: aparece na hora, antes do JavaScript chegar. O app
         desenha a mesma tela (components/Loading) enquanto carrega fontes e login,
         então a troca não pisca. Some sozinha quando o React assume o #root. -->
    <style>
      .pq-boot { flex: 1; display: flex; align-items: center; justify-content: center; background: #101418; }
      .pq-mark { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; }
      .pq-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #c8f23c; background: rgba(200, 242, 60, 0.08); animation: pq-ping 1.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; }
      .pq-ring.b { animation-delay: 0.8s; }
      .pq-dot { width: 22px; height: 22px; border-radius: 50%; background: #c8f23c; border: 4px solid #16200a; }
      @keyframes pq-ping { from { transform: scale(0.15); opacity: 0.7; } to { transform: scale(1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .pq-ring { animation: none; opacity: 0.25; transform: scale(0.5); } }
    </style>
  </head>
  <body>
    <noscript>O Pique precisa do JavaScript ligado para funcionar.</noscript>
    <div id="root">
      <div class="pq-boot" role="progressbar" aria-label="Carregando o Pique">
        <div class="pq-mark"><div class="pq-ring"></div><div class="pq-ring b"></div><div class="pq-dot"></div></div>
      </div>
    </div>
  </body>
</html>
